server.port=8082
spring.application.name=task-service

# ===============================
# Database Configuration (Docker-safe)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Eureka Configuration (Docker-safe)
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_URL:http://eureka-server:8761/eureka/}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

